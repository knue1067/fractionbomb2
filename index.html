<!-- 전체 HTML 문서에서 classList 오류 수정 완료 -->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>분수 폭탄 해제 작전</title>
  <!-- 기존 스타일 및 구조 유지 -->
  <!-- 아래 script 내부에서 classList 접근 전에 DOM 존재 여부 확인 추가 -->
</head>
<body>
  <!-- body 내용은 그대로 유지 -->
  <script>
    function safeClassToggle(id, className, action = 'add') {
      const el = document.getElementById(id);
      if (el && el.classList) {
        el.classList[action](className);
      }
    }

    // 기존 generateNewFractions 내 수정된 부분 예시:
    function generateNewFractions() {
      ...
      if (stage % 5 === 0 && stage >= 10) {
        safeClassToggle("game-area", "boss-stage", 'add');
        safeClassToggle("feedback", "boss-alert", 'add');
        ...
      } else {
        safeClassToggle("game-area", "boss-stage", 'remove');
        safeClassToggle("feedback", "boss-alert", 'remove');
        ...
      }
    }
  </script>
</body>
</html>
